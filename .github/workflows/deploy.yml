name: Qualitet Deploy

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Trigger Render Deploy

        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"