name: Deploy to Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Missing the RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi

          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://api.render.com/deploy/srv-* ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL must be a Render service deploy hook URL."
            exit 1
          fi

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if ! status="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL")"; then
            echo "::error::Could not reach the Render deploy hook."
            exit 1
          fi

          if [[ "$status" != 2?? ]]; then
            echo "::error::Render rejected the deploy request (HTTP $status)."
            exit 1
          fi

          echo "::notice::Render accepted the deployment request (HTTP $status)."
