name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/henryk-command-center-next/package-lock.json

      - name: Install dependencies
        working-directory: apps/henryk-command-center-next
        run: npm ci

      - name: Lint
        working-directory: apps/henryk-command-center-next
        run: npm run lint

      - name: Build
        working-directory: apps/henryk-command-center-next
        run: npm run build