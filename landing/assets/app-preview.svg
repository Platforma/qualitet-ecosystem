<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Henryk Command Center — ekran dashboardu">
  <defs>
